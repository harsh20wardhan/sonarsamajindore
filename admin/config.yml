backend:
  name: git-gateway
  branch: main
  repo: harsh20wardhan/sonarsamajindore

local_backend: true

media_folder: "src/gallery"
public_folder: "./src/gallery"

site_url: "https://sonarsamaj.com"
display_url: "https://sonarsamaj.com"
logo_url: "https://placehold.co/120x120/831843/ffffff?text=ॐ"

# Publish Mode: Instant publishing
publish_mode: simple
show_preview_links: true

collections:
  - name: "event_showcase"
    label: "📸 Events & Photos Showcase"
    label_singular: "Showcase Event"
    description: "Publish comprehensive community event stories with photo sets, attendee counts, and highlights."
    files:
      - file: "content/event_showcase.json"
        name: "event_showcase_file"
        label: "Events Showcase Collection"
        fields:
          - label: "Showcase Events List"
            name: "items"
            widget: "list"
            summary: "{{fields.title_mr}} [{{fields.category_mr}}]"
            fields:
              - { label: "Event ID", name: "id", widget: "string" }
              - { label: "Category Key", name: "category_key", widget: "select", options: ["cultural", "gathering", "health", "youth", "social"], default: "cultural" }
              - { label: "Category (Marathi)", name: "category_mr", widget: "string", default: "धार्मिक व सांस्कृतिक" }
              - { label: "Category (Hindi)", name: "category_hi", widget: "string", default: "धार्मिक एवं सांस्कृतिक" }
              - { label: "Category (English)", name: "category_en", widget: "string", default: "Religious & Cultural" }
              - { label: "Event Title (Marathi)", name: "title_mr", widget: "string" }
              - { label: "Event Title (Hindi)", name: "title_hi", widget: "string" }
              - { label: "Event Title (English)", name: "title_en", widget: "string" }
              - { label: "Date (Marathi)", name: "date_mr", widget: "string" }
              - { label: "Date (Hindi)", name: "date_hi", widget: "string" }
              - { label: "Date (English)", name: "date_en", widget: "string" }
              - { label: "Venue (Marathi)", name: "venue_mr", widget: "string" }
              - { label: "Venue (Hindi)", name: "venue_hi", widget: "string" }
              - { label: "Venue (English)", name: "venue_en", widget: "string" }
              - { label: "Summary / Story (Marathi)", name: "summary_mr", widget: "text" }
              - { label: "Summary / Story (Hindi)", name: "summary_hi", widget: "text" }
              - { label: "Summary / Story (English)", name: "summary_en", widget: "text" }
              - { label: "Organizer (Marathi)", name: "organizer_mr", widget: "string" }
              - { label: "Organizer (Hindi)", name: "organizer_hi", widget: "string" }
              - { label: "Organizer (English)", name: "organizer_en", widget: "string" }
              - label: "Event Photo Gallery"
                name: "photos"
                widget: "list"
                fields:
                  - { label: "Photo", name: "url", widget: "image" }
                  - { label: "Caption (Marathi)", name: "caption_mr", widget: "string" }
                  - { label: "Caption (Hindi)", name: "caption_hi", widget: "string" }
                  - { label: "Caption (English)", name: "caption_en", widget: "string" }

  - name: "gallery"
    label: "📸 Photo Gallery"
    label_singular: "Photo"
    description: "Upload and manage photos displayed in the live website gallery."
    files:
      - file: "content/gallery.json"
        name: "gallery_file"
        label: "Gallery Photo Collection"
        fields:
          - label: "Photos List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} [{{fields.category}}]"
            fields:
              - { label: "Photo Title / Caption", name: "title", widget: "string", hint: "e.g. Annual Community Gathering, Indore" }
              - { label: "Category", name: "category", widget: "select", options: ["Events", "Festivals", "Social Welfare", "Press Coverage", "Education", "Healthcare"], default: "Events" }
              - { label: "Upload Image", name: "image", widget: "image" }
              - { label: "Subtitle or Date (Optional)", name: "subtitle", widget: "string", required: false, hint: "e.g. September 2026" }

  - name: "events"
    label: "📅 Upcoming Events"
    label_singular: "Event"
    description: "Manage upcoming community events, Maha Aartis, and meetings."
    files:
      - file: "content/events.json"
        name: "events_file"
        label: "Upcoming Events Schedule"
        fields:
          - label: "Events List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date_display}}"
            fields:
              - { label: "Event Title", name: "title", widget: "string", hint: "e.g. Samuhik Atharvashirsha & Ganpati Maha Aarti" }
              - { label: "Date", name: "date_display", widget: "string", default: "20 September 2026", hint: "e.g. 20 September 2026" }
              - { label: "Time", name: "time", widget: "string", default: "4:00 PM to 6:00 PM | Maha Aarti 6:30 PM", hint: "e.g. 4:00 PM to 6:00 PM" }
              - { label: "Venue / Location", name: "location", widget: "string", default: "Luv-Kush Awas Vihar, Indore" }
              - { label: "Category", name: "category", widget: "select", options: ["Maha Aarti", "Cultural Festival", "Healthcare Camp", "Youth Workshop", "Annual Meeting", "Other"], default: "Maha Aarti" }
              - { label: "Description", name: "description", widget: "text", hint: "Brief summary of the program and schedule" }
              - { label: "Banner Image (Optional)", name: "image", widget: "image", required: false }

  - name: "news"
    label: "📰 News & Announcements"
    label_singular: "News Item"
    description: "Publish news bulletins and trust announcements."
    files:
      - file: "content/news.json"
        name: "news_file"
        label: "Community News Bulletin"
        fields:
          - label: "News List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date_display}})"
            fields:
              - { label: "Headline / Title", name: "title", widget: "string", hint: "e.g. New Executive Committee Announced" }
              - { label: "Date Display", name: "date_display", widget: "string", default: "12 September" }
              - { label: "Short Summary", name: "summary", widget: "text" }

  - name: "settings"
    label: "⚙️ Trust Contact & Banking"
    label_singular: "Setting"
    description: "Update official addresses, phone numbers, and donation bank details."
    files:
      - file: "content/settings.json"
        name: "settings_file"
        label: "Trust Information & Payment Details"
        fields:
          - { label: "Trust Full Name", name: "trust_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Primary Helpline Phone", name: "phone_primary", widget: "string" }
          - { label: "Secondary Helpline Phone", name: "phone_secondary", widget: "string" }
          - { label: "Official Email", name: "email", widget: "string" }
          - { label: "Registered Office Address", name: "address", widget: "text" }
          - { label: "Donation UPI ID", name: "upi_id", widget: "string" }
          - { label: "Bank Account Number", name: "bank_account", widget: "string" }
          - { label: "Bank IFSC Code", name: "bank_ifsc", widget: "string" }
          - { label: "Bank Branch Name", name: "bank_branch", widget: "string" }
